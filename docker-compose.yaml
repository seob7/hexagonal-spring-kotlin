# 로컬 개발용 MySQL. 애플리케이션 실행 전에 먼저 띄운다.
#   docker compose up -d
#
# 기본 접속 정보는 common/src/main/resources/mysql.yaml 의 기본값과 일치한다.
services:
  mysql:
    image: mysql:8.4
    container_name: hexagonal-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "hexagonal"
      TZ: "Asia/Seoul"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - hexagonal-mysql-data:/var/lib/mysql

volumes:
  hexagonal-mysql-data:
